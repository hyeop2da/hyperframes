name: chiikawa-desk-exe
on:
  workflow_dispatch:
  push:
    branches: [claude/zealous-bell-4lts84]
    paths: ["chiikawa-desk/**", ".github/workflows/chiikawa-desk-exe.yml"]
jobs:
  build:
    runs-on: windows-latest
    env:
      CODESIGN_PFX: ${{ secrets.CODESIGN_PFX_BASE64 }}
      CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build exe
        working-directory: chiikawa-desk
        shell: cmd
        run: |
          echo BUILD = "%GITHUB_SHA:~0,7%"> build_info.py
          python -m pip install pyinstaller PyQt5
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name ChiikawaDesk --add-data "frames\poses;frames\poses" --add-data "ui;ui" chiikawa_desk.py
      - name: Sign exe (only when a code-signing certificate is configured)
        if: ${{ env.CODESIGN_PFX != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CODESIGN_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 chiikawa-desk/dist/ChiikawaDesk.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool.FullName verify /pa chiikawa-desk/dist/ChiikawaDesk.exe
          Remove-Item $pfx
      - uses: actions/upload-artifact@v4
        with:
          name: ChiikawaDesk-windows
          path: chiikawa-desk/dist/ChiikawaDesk.exe
